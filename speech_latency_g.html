<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Speech Timeline & Event Fan-out Demo</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #eee;
    }

    button {
      padding: 10px 15px;
      margin-bottom: 10px;
      margin-right: 10px;
      cursor: pointer;
      font-weight: bold;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }

    button:hover {
      background: #444;
    }

    canvas {
      background: #2a2a2a;
      display: block;
      margin-bottom: 15px;
      width: 100%;
      max-width: 1000px;
      height: 350px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    pre {
      background: #222;
      padding: 10px;
      white-space: pre-wrap;
      color: #0f0;
      border: 1px solid #444;
      max-height: 300px;
      overflow-y: auto;
      max-width: 980px;
    }

    .description {
      font-family: monospace;
      color: #aaa;
      max-width: 1000px;
      line-height: 1.5;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <button id="btnMic">Start Mic Transcription & Timeline</button>
  <button id="btnFile">Play & Transcribe Audio File</button>

  <audio id="audioPlayer" src="https://raw.githubusercontent.com/web-platform-tests/wpt/master/media/speech.wav"
    crossorigin="anonymous"></audio>

  <div class="description">
    <p><b>Notice the Fan-Out:</b> You will see multiple arrows fanning out from a single text label. These point to the
      exact timestamps when the API fired interim and final updates, highlighting how frequently it processes the audio
      chunk.</p>
  </div>

  <canvas id="timeline" width="1000" height="350"></canvas>
  <pre id="log"></pre>

  <script>
    const canvas = document.getElementById('timeline');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');

    const log = msg => {
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    };

    const DURATION_MS = 10000;

    let audioCtx, analyser, dataArray;
    let audioHistory = [];
    let transcripts = [];  // Stores { id, text, times: [], isFinal }
    let streamStartStamp = 0;

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRec();
    recognition.continuous = true;
    recognition.interimResults = true;

    const endpointerEvents = ['audiostart', 'soundstart', 'speechstart', 'speechend', 'soundend', 'audioend'];
    endpointerEvents.forEach(eventName => {
      recognition.addEventListener(eventName, (e) => {
        log(`[EVENT: ${eventName}] timeStamp: ${e.timeStamp.toFixed(1)}ms`);
      });
    });

    recognition.onstart = (e) => {
      streamStartStamp = e.timeStamp;
      log(`[STARTED] Stream Start TimeStamp: ${streamStartStamp.toFixed(1)}ms\n`);
    };

    recognition.onresult = (e) => {
      const now = performance.now();
      const timeReceived = e.timeStamp;

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const result = e.results[i];
        const text = result[0].transcript.trim();
        if (!text) continue;

        let audioTime = timeReceived;
        if (result.audioStartTime !== undefined) {
          audioTime = result.audioStartTime;
        }

        const existingLabel = transcripts.find(t => t.id === i);

        if (existingLabel) {
          existingLabel.text = text;
          existingLabel.isFinal = result.isFinal;
          // Push every interim/final update timestamp into the array
          existingLabel.times.push(audioTime);
        } else {
          transcripts.push({
            id: i,
            text: text,
            times: [audioTime],
            isFinal: result.isFinal
          });
        }
      }

      // Log only the primary result to avoid console spam
      const primaryResult = e.results[e.resultIndex];
      const primaryText = primaryResult[0].transcript.trim();
      const isFinalStr = primaryResult.isFinal ? "(FINAL)" : "(INTERIM)";

      log(`${isFinalStr} "${primaryText}"`);
      log(` ↳ ev.timeStamp : ${timeReceived.toFixed(1)}ms`);
      log('');
    };

    recognition.onerror = e => log(`[ERROR] ${e.error}`);
    recognition.onend = () => log(`[ENDED] Recognition stopped.\n`);

    async function start(playFile = false) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);

          if (playFile) {
            log('[INFO] Playing audio file. Ensure speakers are on!\n');
            document.getElementById('audioPlayer').play();
          }

          recognition.start();
          requestAnimationFrame(draw);
          document.getElementById('btnMic').disabled = true;
          document.getElementById('btnFile').disabled = true;
        } catch (err) {
          alert('Could not start microphone: ' + err);
        }
      }
    }

    function draw() {
      requestAnimationFrame(draw);
      const currentTime = performance.now();

      // Audio Amplitude
      analyser.getByteTimeDomainData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = (dataArray[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / dataArray.length);

      audioHistory.push({ time: currentTime, rms });

      while (audioHistory.length > 0 && currentTime - audioHistory[0].time > DURATION_MS) {
        audioHistory.shift();
      }

      // Keep transcripts visible slightly longer
      transcripts = transcripts.filter(t => currentTime - t.times[0] <= DURATION_MS * 1.5);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Waveform
      ctx.fillStyle = '#00e5ff';
      const waveCenterY = 130;

      ctx.beginPath();
      ctx.moveTo(0, waveCenterY);

      for (const point of audioHistory) {
        const x = canvas.width - ((currentTime - point.time) / DURATION_MS) * canvas.width;
        const h = point.rms * 300;
        ctx.lineTo(x, waveCenterY - h);
      }
      for (let i = audioHistory.length - 1; i >= 0; i--) {
        const point = audioHistory[i];
        const x = canvas.width - ((currentTime - point.time) / DURATION_MS) * canvas.width;
        const h = point.rms * 300;
        ctx.lineTo(x, waveCenterY + h);
      }
      ctx.fill();

      // Timeline Axis
      ctx.fillStyle = '#888';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;

      for (let i = 0; i <= Math.ceil(DURATION_MS / 1000); i++) {
        const tickTimeMs = Math.floor(currentTime / 1000) * 1000 - (i * 1000);
        const timeDiff = currentTime - tickTimeMs;

        if (timeDiff >= 0 && timeDiff <= DURATION_MS) {
          const x = canvas.width - (timeDiff / DURATION_MS) * canvas.width;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 30);
          ctx.stroke();
          ctx.fillText(`${(tickTimeMs / 1000).toFixed(1)}s`, x, 45);
        }
      }

      // Transcripts and Arrows
      ctx.lineWidth = 1;

      for (let i = 0; i < transcripts.length; i++) {
        const t = transcripts[i];

        // Anchor the text to the *first* timestamp
        const anchorTime = t.times[0];
        const textTargetX = canvas.width - ((currentTime - anchorTime) / DURATION_MS) * canvas.width;
        const textY = 250 + (i % 4) * 25;

        ctx.fillStyle = t.isFinal ? '#ffffff' : '#888888';
        ctx.strokeStyle = t.isFinal ? '#ffffff' : '#888888';
        ctx.font = t.isFinal ? 'bold 14px sans-serif' : 'italic 14px sans-serif';

        const label = `${t.text} (${t.times.length} updates)`;
        ctx.fillText(label, textTargetX, textY);

        // Draw an arrow for EVERY timestamp this chunk received
        for (const updateTime of t.times) {
          const arrowX = canvas.width - ((currentTime - updateTime) / DURATION_MS) * canvas.width;

          ctx.beginPath();
          ctx.moveTo(textTargetX, textY - 18);
          ctx.lineTo(arrowX, waveCenterY + 40);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(arrowX, waveCenterY + 30);
          ctx.lineTo(arrowX - 4, waveCenterY + 40);
          ctx.lineTo(arrowX + 4, waveCenterY + 40);
          ctx.fill();
        }
      }
    }

    document.getElementById('btnMic').onclick = () => start(false);
    document.getElementById('btnFile').onclick = () => start(true);
  </script>
</body>

</html>
