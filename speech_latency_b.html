<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Speech API + Waveform Demo</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
    }

    button {
      padding: 10px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    canvas {
      background: #222;
      display: block;
      margin-bottom: 10px;
      width: 100%;
      max-width: 800px;
      height: 150px;
      border-radius: 4px;
    }

    #transcriptWords {
      font-size: 1.5em;
      margin-bottom: 20px;
      min-height: 2em;
      font-family: sans-serif;
    }

    pre {
      background: #f4f4f4;
      padding: 10px;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 300px;
    }
  </style>
</head>

<body>
  <button id="btnMic">Start Mic Transcription & Waveform</button>

  <!-- Waveform and Live Text -->
  <canvas id="waveform" width="800" height="150"></canvas>
  <div id="transcriptWords">...</div>

  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    const log = msg => { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; };
    const transcriptEl = document.getElementById('transcriptWords');
    const canvas = document.getElementById('waveform');
    const canvasCtx = canvas.getContext('2d');

    // Initialize Web Speech API
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRec();
    recognition.continuous = true;
    recognition.interimResults = true;

    let audioCtx, analyser, dataArray;
    let streamStartStamp = 0;

    // Web Audio API Setup for the Waveform
    async function startAudioVisualization() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);
          drawWaveform();
        } catch (err) {
          log('[ERROR] Could not get microphone for visualization: ' + err);
        }
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function drawWaveform() {
      requestAnimationFrame(drawWaveform);
      analyser.getByteTimeDomainData(dataArray);

      canvasCtx.fillStyle = 'rgb(34, 34, 34)';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeStyle = 'rgb(0, 255, 128)';
      canvasCtx.beginPath();

      const sliceWidth = canvas.width * 1.0 / analyser.frequencyBinCount;
      let x = 0;

      for (let i = 0; i < analyser.frequencyBinCount; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;
        if (i === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);
        x += sliceWidth;
      }
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
    }

    // Web Speech API Event Handlers
    recognition.onstart = (e) => {
      streamStartStamp = e.timeStamp;
      log(`[STARTED] Stream Start TimeStamp: ${streamStartStamp.toFixed(1)}ms\n`);
    };

    recognition.onresult = (e) => {
      const now = performance.now();
      const evStamp = e.timeStamp;

      const result = e.results[e.resultIndex];
      const text = result[0].transcript;
      const isFinal = result.isFinal ? "(FINAL)" : "(INTERIM)";

      // Display live text right below the waveform
      transcriptEl.textContent = text;

      log(`${isFinal} "${text}"`);
      log(` ↳ ev.timeStamp : ${evStamp.toFixed(1)}ms`);

      // Checking for the future audio timing attributes proposed in #191
      if (result.audioStartTime !== undefined) {
        log(` ↳ audioStartTime : ${result.audioStartTime}ms`);
        log(` ↳ audioEndTime   : ${result.audioEndTime}ms`);
        log(` ↳ True Latency   : ${(evStamp - result.audioEndTime).toFixed(1)}ms`);
      } else {
        log(` ↳ e2e DOM Latency: ${(now - evStamp).toFixed(1)}ms`);
      }
      log('');
    };

    recognition.onerror = e => log(`[ERROR] ${e.error}`);
    recognition.onend = () => log(`[ENDED] Recognition stopped.\n`);

    // Button Listener
    document.getElementById('btnMic').onclick = () => {
      startAudioVisualization();
      recognition.start();
    };
  </script>
</body>

</html>
