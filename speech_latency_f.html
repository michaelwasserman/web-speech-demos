<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Speech Timeline & Endpointer Events Demo</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #eee;
    }

    button {
      padding: 10px 15px;
      margin-bottom: 10px;
      margin-right: 10px;
      cursor: pointer;
      font-weight: bold;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }

    button:hover {
      background: #444;
    }

    canvas {
      background: #2a2a2a;
      display: block;
      margin-bottom: 15px;
      width: 100%;
      max-width: 1000px;
      height: 350px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    pre {
      background: #222;
      padding: 10px;
      white-space: pre-wrap;
      color: #0f0;
      border: 1px solid #444;
      max-height: 300px;
      overflow-y: auto;
      max-width: 980px;
    }

    .description {
      font-family: monospace;
      color: #aaa;
      max-width: 1000px;
      line-height: 1.5;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <button id="btnMic">Start Mic Transcription & Timeline</button>
  <button id="btnFile">Play & Transcribe Audio File</button>

  <audio id="audioPlayer" src="https://raw.githubusercontent.com/web-platform-tests/wpt/master/media/speech.wav"
    crossorigin="anonymous"></audio>

  <div class="description">
    <p><b>Notice the Latency:</b> Because standard browsers do not yet support <code>audioStartTime</code>, this demo
      places arrows using the <code>event.timeStamp</code> fallback. You should see the text arrows appearing slightly
      <i>after</i> the visual spikes in the waveform, exposing the time it took for the ASR engine to process the
      speech.
    </p>
  </div>

  <!-- Scrolling Timeline Canvas -->
  <canvas id="timeline" width="1000" height="350"></canvas>

  <!-- Text Log -->
  <pre id="log"></pre>

  <script>
    const canvas = document.getElementById('timeline');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');

    const log = msg => {
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    };

    // Timeline settings
    const DURATION_MS = 10000; // Show 10 seconds of history

    let audioCtx, analyser, dataArray;
    let audioHistory = []; // Stores { time, rms }
    let transcripts = [];  // Stores { text, audioTime, isFinal }
    let streamStartStamp = 0;

    // Initialize Web Speech API
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRec();
    recognition.continuous = true;
    recognition.interimResults = true;

    // Log Endpointer Events
    const endpointerEvents = ['audiostart', 'soundstart', 'speechstart', 'speechend', 'soundend', 'audioend'];
    endpointerEvents.forEach(eventName => {
      recognition.addEventListener(eventName, (e) => {
        log(`[EVENT: ${eventName}] timeStamp: ${e.timeStamp.toFixed(1)}ms`);
      });
    });

    recognition.onstart = (e) => {
      streamStartStamp = e.timeStamp;
      log(`[STARTED] Stream Start TimeStamp: ${streamStartStamp.toFixed(1)}ms\n`);
    };

    recognition.onresult = (e) => {
      const now = performance.now();
      const timeReceived = e.timeStamp;

      // The API provides an array of results. We only care about the latest ones.
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const result = e.results[i];
        const text = result[0].transcript.trim();
        if (!text) continue;

        // Attempt to use the proposed attribute from PR #191, fallback to event.timeStamp
        let audioTime = timeReceived;
        if (result.audioStartTime !== undefined) {
          audioTime = result.audioStartTime;
        }

        // 1. Check if we already have a label on the timeline for this result index
        const existingLabel = transcripts.find(t => t.id === i);

        if (existingLabel) {
          // Update the existing label's text and final status in place
          existingLabel.text = text;
          existingLabel.isFinal = result.isFinal;
        } else {
          // 2. If it's a new phrase, create a new label anchored to this timestamp
          transcripts.push({
            id: i,
            text: text,
            audioTime: audioTime,
            isFinal: result.isFinal
          });
        }
      }

      // -- Logging Logic --
      // (Optional: We log only the primary current result to avoid console spam)
      const primaryResult = e.results[e.resultIndex];
      const primaryText = primaryResult[0].transcript.trim();
      const isFinalStr = primaryResult.isFinal ? "(FINAL)" : "(INTERIM)";
      const deltaFromStart = timeReceived - streamStartStamp;

      log(`${isFinalStr} "${primaryText}"`);
      log(` ↳ ev.timeStamp : ${timeReceived.toFixed(1)}ms`);
      if (primaryResult.audioStartTime !== undefined) {
        log(` ↳ True Latency : ${(timeReceived - primaryResult.audioEndTime).toFixed(1)}ms`);
      } else {
        log(` ↳ DOM Latency  : ${(now - timeReceived).toFixed(1)}ms`);
      }
      log('');
    };

    recognition.onerror = e => log(`[ERROR] ${e.error}`);
    recognition.onend = () => log(`[ENDED] Recognition stopped.\n`);

    // Audio & Canvas Initialization
    async function start(playFile = false) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        try {
          // Note: Web Speech API always listens to default system mic.
          // To transcribe a file, we play it out loud and capture it via mic.
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);

          if (playFile) {
            log('[INFO] Playing audio file. Ensure speakers are on so mic can hear it!\n');
            document.getElementById('audioPlayer').play();
          }

          recognition.start();
          requestAnimationFrame(draw);
          document.getElementById('btnMic').disabled = true;
          document.getElementById('btnFile').disabled = true;
        } catch (err) {
          alert('Could not start microphone: ' + err);
        }
      }
    }

    // Main Render Loop
    function draw() {
      requestAnimationFrame(draw);
      const currentTime = performance.now();

      // 1. Calculate audio amplitude envelope (RMS)
      analyser.getByteTimeDomainData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = (dataArray[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / dataArray.length);

      audioHistory.push({ time: currentTime, rms });

      while (audioHistory.length > 0 && currentTime - audioHistory[0].time > DURATION_MS) {
        audioHistory.shift();
      }

      transcripts = transcripts.filter(t => currentTime - t.audioTime <= DURATION_MS && (!t.isFinal ? currentTime - t.audioTime < 2000 : true));

      // 2. Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 3. Draw Scrolling Waveform
      ctx.fillStyle = '#00e5ff';
      const waveCenterY = 130;

      ctx.beginPath();
      ctx.moveTo(0, waveCenterY);

      for (const point of audioHistory) {
        const x = canvas.width - ((currentTime - point.time) / DURATION_MS) * canvas.width;
        const h = point.rms * 300;
        ctx.lineTo(x, waveCenterY - h);
      }
      for (let i = audioHistory.length - 1; i >= 0; i--) {
        const point = audioHistory[i];
        const x = canvas.width - ((currentTime - point.time) / DURATION_MS) * canvas.width;
        const h = point.rms * 300;
        ctx.lineTo(x, waveCenterY + h);
      }
      ctx.fill();

      // 4. Draw Timeline Axis (Numeric Timestamp Info)
      ctx.fillStyle = '#888';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;

      for (let i = 0; i <= Math.ceil(DURATION_MS / 1000); i++) {
        const tickTimeMs = Math.floor(currentTime / 1000) * 1000 - (i * 1000);
        const timeDiff = currentTime - tickTimeMs;

        if (timeDiff >= 0 && timeDiff <= DURATION_MS) {
          const x = canvas.width - (timeDiff / DURATION_MS) * canvas.width;

          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 30);
          ctx.stroke();

          ctx.fillText(`${(tickTimeMs / 1000).toFixed(1)}s`, x, 45);
        }
      }

      // 5. Draw Transcripts and Arrows
      ctx.lineWidth = 2;

      for (let i = 0; i < transcripts.length; i++) {
        const t = transcripts[i];
        const targetX = canvas.width - ((currentTime - t.audioTime) / DURATION_MS) * canvas.width;
        const textY = 250 + (i % 4) * 25;

        ctx.fillStyle = t.isFinal ? '#ffffff' : '#888888';
        ctx.strokeStyle = t.isFinal ? '#ffffff' : '#888888';
        ctx.font = t.isFinal ? 'bold 14px sans-serif' : 'italic 14px sans-serif';

        const label = `${t.text} [t=${t.audioTime.toFixed(0)}ms]`;
        ctx.fillText(label, targetX, textY);

        ctx.beginPath();
        ctx.moveTo(targetX, textY - 18);
        ctx.lineTo(targetX, waveCenterY + 40);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(targetX, waveCenterY + 30);
        ctx.lineTo(targetX - 5, waveCenterY + 40);
        ctx.lineTo(targetX + 5, waveCenterY + 40);
        ctx.fill();
      }
    }

    document.getElementById('btnMic').onclick = () => start(false);
    document.getElementById('btnFile').onclick = () => start(true);
  </script>
</body>

</html>
