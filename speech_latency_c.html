<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Speech Timeline Alignment Demo</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #eee;
    }

    button {
      padding: 10px 15px;
      margin-bottom: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    canvas {
      background: #2a2a2a;
      display: block;
      margin-bottom: 15px;
      width: 100%;
      max-width: 1000px;
      height: 350px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .description {
      font-family: monospace;
      color: #aaa;
      max-width: 1000px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <button id="btnMic">Start Mic Transcription & Timeline</button>

  <!-- Scrolling Timeline Canvas -->
  <canvas id="timeline" width="1000" height="350"></canvas>

  <div class="description">
    <p><b>Notice the Latency:</b> Because standard browsers do not yet support <code>audioStartTime</code>, this demo
      places arrows using the <code>event.timeStamp</code> fallback. You should see the text arrows appearing slightly
      <i>after</i> the visual spikes in the waveform, exposing the time it took for the ASR engine to process the
      speech.</p>
  </div>

  <script>
    const canvas = document.getElementById('timeline');
    const ctx = canvas.getContext('2d');

    // Timeline settings
    const DURATION_MS = 10000; // Show 10 seconds of history

    let audioCtx, analyser, dataArray;
    let audioHistory = []; // Stores { time, rms }
    let transcripts = [];  // Stores { text, audioTime, isFinal }

    // Initialize Web Speech API
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRec();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (e) => {
      const result = e.results[e.resultIndex];
      const text = result[0].transcript.trim();
      if (!text) return;

      const timeReceived = e.timeStamp;

      // Attempt to use the proposed attribute from PR #191, fallback to event.timeStamp
      const audioTime = result.audioStartTime !== undefined ? result.audioStartTime : timeReceived;

      // Update existing interim result or add a new final result
      if (result.isFinal) {
        transcripts.push({ text, audioTime, isFinal: true });
      } else {
        // Temporarily hold interim text for visualization
        transcripts.push({ text: text + '...', audioTime, isFinal: false });
      }
    };

    recognition.onerror = e => console.error('[Speech API Error]', e.error);

    // Audio & Canvas Initialization
    async function start() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);

          recognition.start();
          requestAnimationFrame(draw);
          document.getElementById('btnMic').disabled = true;
          document.getElementById('btnMic').innerText = "Listening...";
        } catch (err) {
          alert('Could not start microphone: ' + err);
        }
      }
    }

    // Main Render Loop
    function draw() {
      requestAnimationFrame(draw);
      const currentTime = performance.now();

      // 1. Calculate audio amplitude envelope (RMS)
      analyser.getByteTimeDomainData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = (dataArray[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / dataArray.length);

      // Store current amplitude in history
      audioHistory.push({ time: currentTime, rms });

      // Prune history older than our timeline duration
      while (audioHistory.length > 0 && currentTime - audioHistory[0].time > DURATION_MS) {
        audioHistory.shift();
      }

      // Prune old transcripts to keep canvas clean
      transcripts = transcripts.filter(t => currentTime - t.audioTime <= DURATION_MS && (!t.isFinal ? currentTime - t.audioTime < 2000 : true));

      // 2. Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 3. Draw Scrolling Waveform
      ctx.fillStyle = '#00e5ff';
      const waveCenterY = 100;

      ctx.beginPath();
      ctx.moveTo(0, waveCenterY);

      // Draw top half of waveform envelope
      for (const point of audioHistory) {
        const x = canvas.width - ((currentTime - point.time) / DURATION_MS) * canvas.width;
        const h = point.rms * 300; // Scale amplitude
        ctx.lineTo(x, waveCenterY - h);
      }
      // Draw bottom half of waveform envelope in reverse
      for (let i = audioHistory.length - 1; i >= 0; i--) {
        const point = audioHistory[i];
        const x = canvas.width - ((currentTime - point.time) / DURATION_MS) * canvas.width;
        const h = point.rms * 300;
        ctx.lineTo(x, waveCenterY + h);
      }
      ctx.fill();

      // 4. Draw Transcripts and Arrows
      ctx.textAlign = 'center';

      for (let i = 0; i < transcripts.length; i++) {
        const t = transcripts[i];

        // Calculate X position based on when audio supposedly happened
        const targetX = canvas.width - ((currentTime - t.audioTime) / DURATION_MS) * canvas.width;

        // Stagger text heights to prevent overlapping
        const textY = 280 + (i % 3) * 25;

        // Set styles based on if result is final or interim
        ctx.fillStyle = t.isFinal ? '#ffffff' : '#888888';
        ctx.strokeStyle = t.isFinal ? '#ffffff' : '#888888';
        ctx.font = t.isFinal ? 'bold 16px sans-serif' : 'italic 16px sans-serif';

        // Draw Text
        ctx.fillText(t.text, targetX, textY);

        // Draw Connecting Line/Arrow
        ctx.beginPath();
        ctx.moveTo(targetX, textY - 18);
        ctx.lineTo(targetX, waveCenterY + 40); // Stop slightly below waveform
        ctx.stroke();

        // Draw Arrowhead
        ctx.beginPath();
        ctx.moveTo(targetX, waveCenterY + 30);
        ctx.lineTo(targetX - 5, waveCenterY + 40);
        ctx.lineTo(targetX + 5, waveCenterY + 40);
        ctx.fill();
      }
    }

    document.getElementById('btnMic').onclick = start;
  </script>
</body>

</html>
