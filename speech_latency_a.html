<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SpeechRecognition TimeStamp Demo</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    button { padding: 10px; margin-right: 10px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <button id="btnMic">Start Mic Transcription</button>
  <button id="btnFile">Play & Transcribe Audio File</button>
  <audio id="audioPlayer" src="https://raw.githubusercontent.com/web-platform-tests/wpt/master/media/speech.wav" crossorigin="anonymous"></audio>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    const log = msg => logEl.textContent += msg + '\n';

    // Initialize Web Speech API
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRec();
    recognition.continuous = true;
    recognition.interimResults = true;

    let streamStartStamp = 0;

    recognition.onstart = (e) => {
      streamStartStamp = e.timeStamp;
      log(`[STARTED] Stream Start TimeStamp: ${streamStartStamp.toFixed(1)}ms\n`);
    };

    recognition.onresult = (e) => {
      const now = performance.now(); // Current time of event receipt
      const evStamp = e.timeStamp;   // DOMHighResTimeStamp of the event
      
      // Calculations
      const deltaFromStart = evStamp - streamStartStamp;
      const latencyE2E = now - evStamp; 
      const wallClock = new Date(performance.timeOrigin + evStamp);

      // Get transcribed text
      const result = e.results[e.resultIndex];
      const text = result[0].transcript;
      const isFinal = result.isFinal ? "(FINAL)" : "(INTERIM)";

      log(`${isFinal} "${text}"`);
      log(` ↳ ev.timeStamp : ${evStamp.toFixed(1)}ms`);
      log(` ↳ Wall Clock   : ${wallClock.toISOString()}`);
      log(` ↳ Stream Delta : ${deltaFromStart.toFixed(1)}ms`);
      log(` ↳ e2e Latency  : ${latencyE2E.toFixed(1)}ms\n`);
    };

    recognition.onerror = e => log(`[ERROR] ${e.error}`);
    recognition.onend = () => log(`[ENDED] Recognition stopped.\n`);

    // Button Listeners
    document.getElementById('btnMic').onclick = () => recognition.start();
    
    document.getElementById('btnFile').onclick = () => {
      log('[INFO] Web Speech API natively only listens to the default microphone. Please ensure your speakers are turned up so the mic can hear the audio file!\n');
      document.getElementById('audioPlayer').play();
      recognition.start();
    };
  </script>
</body>
</html>
